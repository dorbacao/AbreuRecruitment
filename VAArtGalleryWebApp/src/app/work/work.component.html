<div class="container">
    <h1>
      Artes da galeria
    </h1>

    <div class="button-container">
        <button mat-button color="primary" [routerLink]="'/'">Lista de Galerias</button>
      </div>

    <table mat-table [dataSource]="works" class="full-width-table">
  
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Nome </th>
        <td mat-cell *matCellDef="let work"> {{work.name}} </td>
      </ng-container>
  
      <ng-container matColumnDef="author">
        <th mat-header-cell *matHeaderCellDef> Autor </th>
        <td mat-cell *matCellDef="let work"> {{work.author}} </td>
      </ng-container>
  
      <ng-container matColumnDef="creationYear">
        <th mat-header-cell *matHeaderCellDef> Ano de Criação </th>
        <td mat-cell *matCellDef="let work"> {{work.creationYear}} </td>
      </ng-container>
  
      <ng-container matColumnDef="askPrice">
        <th mat-header-cell *matHeaderCellDef> Preço Pedido </th>
        <td mat-cell *matCellDef="let work"> {{work.askPrice | money }} </td>
      </ng-container>
<!--   
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let gallery">
          <span>
            <mat-icon aria-hidden="false" aria-label="edit" fontIcon="edit" (click)="editGalleryClick(gallery.id)"></mat-icon>
            <mat-icon aria-hidden="false" aria-label="art works list" fontIcon="list_alt" (click)="openArtWorksList(gallery.id)"></mat-icon>
          </span>
        </td>
      </ng-container> -->
  
  
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
